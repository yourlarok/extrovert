[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extrovert-mcp"
version = "0.1.0"
description = "Capability broker MCP server: lets AI agents discover, install, verify and hot-mount external MCP servers with zero user configuration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yourlarok" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "capability-broker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["mcp>=2.3,<3", "certifi>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
extrovert = "extrovert.__main__:main"

[project.urls]
Homepage = "https://github.com/yourlarok/extrovert"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
